<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body>

    <h1>Cadastro</h1>

    <form id="formCadastro">

        <fieldset>
            <legend>Dados pessoais</legend>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required>
            <small id="erroNome"></small>

            <br><br>

            <label for="cpf">CPF:</label>
            <input type="text"
             id="cpf"
            name="cpf"
            pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}"
            placeholder="000.000.000.00"
            required
            <small id="erroCpf"></small>
         >

            <br><br>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>

        </fieldset>

        <br>

        <fieldset>
            <legend>Dados de contato</legend>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
            <small id="erroEmail"></small>

            <br><br>

            <label for="telefone">Telefone:</label>
            <input type="tel"
             id="telefone"
            name="telefone"
            pattern="\(?\d{2}\)?\s?\d{4,5}-?\d{4}"
            placeholder="(61) 99999-9999"
            required
            <small id="erroTelefone"></small>
        >

        </fieldset>

        <br>

        <fieldset>
            <legend>Dados de endereço</legend>

            <label for="cep">CEP:</label>
            <input type="text" 
            id="cep" 
            name="cep" 
            pattern="\d{5}-?\d{3}"
            placeholder="00000-000"
            required
            <small  id="erroCep"></small>
        >

            <br><br>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" required>
            <small id="erroEndereco"></small>

            <br><br>

            <label for="numero">Número:</label>
            <input type="number" id="numero" name="numero" required>
            <small id="erroNumero"></small>

            <br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" required>
            <small id="erroCidade"></small>

            <br><br>

            <label for="estado">Estado:</label>
            <input type="text" id="estado" name="estado" required>
            <small id="eeroEstado"></small>

        </fieldset>

        <br>

        <button type="submit">Cadastrar</button>

    </form>

<script type="module" src="../js/script.js"></script>
</body>
</html>
